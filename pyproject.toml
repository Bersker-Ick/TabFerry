[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tabferry"
version = "0.1.0"
description = "Ferry your browser tabs to your phone: offline-ready, triageable, self-hosted."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bersker-Ick" }]
keywords = ["tabs", "firefox", "self-hosted", "offline-first", "mobile"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
tabferry = "tabferry.cli:main"

[project.urls]
Homepage = "https://github.com/Bersker-Ick/TabFerry"
Repository = "https://github.com/Bersker-Ick/TabFerry"
Issues = "https://github.com/Bersker-Ick/TabFerry/issues"

[tool.setuptools.packages.find]
include = ["tabferry*"]

[tool.setuptools.package-data]
tabferry = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
