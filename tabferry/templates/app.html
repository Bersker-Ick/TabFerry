<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
<meta name="description" content="A triageable, offline-ready list of browser tabs served by TabFerry.">
<title>__TABFERRY_TITLE__</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#fff; --fg:#1b1b1f; --muted:#6b6b76; --line:#e4e4ea;
    --accent:#e66000; --danger:#d93a2b; --ok:#1a7f37; --warn:#a86500;
    --shadow:0 6px 24px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#101013; --card:#1a1a20; --fg:#ececf1; --muted:#9a9aa5; --line:#2a2a33;
           --accent:#ff8a3d; --danger:#ff6b5e; --ok:#4ade80; --warn:#fbbf24;
           --shadow:0 6px 24px rgba(0,0,0,.5); }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--fg); }
  body{ font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
        "Microsoft YaHei",sans-serif; padding-bottom:env(safe-area-inset-bottom);
        overflow-x:hidden; }
  [hidden]{ display:none !important; }
  .hdr{ position:sticky; top:0; z-index:20; background:var(--bg);
        border-bottom:1px solid var(--line); padding:10px 14px 8px;
        padding-top:calc(10px + env(safe-area-inset-top)); }
  .row1{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .row1 > div:first-child{ min-width:0; }
  h1{ font-size:16px; margin:0; font-weight:650; letter-spacing:.1px; }
  .sub{ font-size:11px; color:var(--muted); margin-top:2px; overflow-wrap:anywhere; }
  .counter{ font-variant-numeric:tabular-nums; color:var(--muted); font-size:11px;
            text-align:right; line-height:1.2; flex:0 0 auto; }
  .counter b{ display:block; font-size:19px; color:var(--fg); }
  .row2{ display:flex; gap:8px; margin-top:9px; }
  .row2 > .btn{ flex:0 0 auto; }
  #q{ flex:1 1 0; min-width:0; padding:9px 12px; border:1px solid var(--line);
      background:var(--card); color:var(--fg); border-radius:11px; font-size:15px;
      outline:none; }
  #q:focus{ border-color:var(--accent); }
  .btn{ border:1px solid var(--line); background:var(--card); color:var(--fg);
        border-radius:11px; padding:9px 12px; font-size:13px; white-space:nowrap;
        cursor:pointer; }
  .btn:active{ transform:scale(.97); }
  .btn.small{ padding:6px 10px; font-size:12px; border-radius:9px; }
  .sync{ font-size:11px; color:var(--muted); margin-top:7px; }
  .sync.ok{ color:var(--ok); }
  .sync.warn{ color:var(--warn); }
  .dl{ color:var(--muted); text-decoration:underline; }
  main{ padding:8px 14px 40px; max-width:820px; margin:0 auto; }
  .list{ list-style:none; margin:0; padding:0; }
  .item{ display:flex; align-items:stretch; background:var(--card);
         border:1px solid var(--line); border-radius:12px; margin:6px 0;
         overflow:hidden; transition:opacity .17s ease, transform .17s ease; }
  .item.out{ opacity:0; transform:translateX(28px); }
  .link{ flex:1; min-width:0; padding:9px 10px 9px 12px; text-decoration:none;
         color:inherit; display:block; }
  .dom{ display:block; font-size:11px; color:var(--accent); font-weight:650;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ttl{ display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
        overflow:hidden; font-size:14px; margin-top:1px; overflow-wrap:anywhere; }
  .url{ display:block; font-size:11px; color:var(--muted); white-space:nowrap;
        overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .rm{ flex:0 0 46px; border:0; border-left:1px solid var(--line);
       background:transparent; color:var(--muted); font-size:22px; line-height:1;
       cursor:pointer; }
  .rm:active{ background:var(--danger); color:#fff; }
  .empty{ text-align:center; color:var(--muted); padding:44px 0; font-size:14px; }
  .mask{ position:fixed; inset:0; background:rgba(0,0,0,.38); z-index:30; }
  .drawer{ position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--card);
           border-radius:16px 16px 0 0; max-height:74vh; display:flex;
           flex-direction:column; box-shadow:0 -8px 30px rgba(0,0,0,.25);
           padding-bottom:env(safe-area-inset-bottom); }
  .drawer-h{ display:flex; align-items:center; justify-content:space-between; gap:8px;
             padding:12px 14px; border-bottom:1px solid var(--line); }
  .drawer-h > div{ display:flex; gap:8px; }
  .drawer-list{ overflow:auto; padding:4px 14px 18px; -webkit-overflow-scrolling:touch; }
  .drawer-f{ display:flex; gap:8px; padding:10px 14px; border-top:1px solid var(--line); }
  .ditem{ display:flex; gap:8px; align-items:center; padding:10px 0;
          border-bottom:1px solid var(--line); }
  .ditem:last-child{ border-bottom:0; }
  .ditem .meta{ flex:1; min-width:0; }
  .ditem .t{ font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ditem .u{ font-size:11px; color:var(--muted); overflow:hidden;
             text-overflow:ellipsis; white-space:nowrap; }
  .toast{ position:fixed; left:50%; transform:translateX(-50%);
          bottom:calc(18px + env(safe-area-inset-bottom)); z-index:50;
          display:flex; align-items:center; gap:10px; background:#232327; color:#fff;
          padding:10px 14px; border-radius:12px; font-size:13px; box-shadow:var(--shadow);
          max-width:92vw; }
  .toast .btn{ background:transparent; border-color:rgba(255,255,255,.35); color:#fff; }
</style>
</head>
<body>
<header class="hdr">
  <div class="row1">
    <div>
      <h1>TabFerry</h1>
      <div class="sub"><span>__TABFERRY_GENERATED__ · __TABFERRY_SOURCE__</span><span id="dedupeNote"></span></div>
    </div>
    <div class="counter"><b id="remain">__TABFERRY_TOTAL__</b><span id="counterSuffix"></span></div>
  </div>
  <div class="row2">
    <input id="q" type="search" placeholder="Search title or URL…" autocomplete="off"
           enterkeyhint="search">
    <button id="openRemoved" class="btn" type="button"><span id="removedLabel">Removed</span>
      <span id="removedCount">0</span></button>
  </div>
  <div id="sync" class="sync">
    <span id="syncText">Connecting…</span> ·
    <a id="downloadLink" class="dl" href="download" download="tabferry.html">Save offline copy</a>
  </div>
</header>

<main>
  <ul id="list" class="list"></ul>
  <div id="empty" class="empty" hidden>No matches</div>
</main>

<div id="mask" class="mask" hidden></div>
<section id="drawer" class="drawer" hidden aria-label="Removed tabs">
  <div class="drawer-h">
    <b><span id="drawerLabel">Removed</span> <span id="drawerCount">0</span></b>
    <div>
      <button id="restoreAll" class="btn small" type="button">Restore all</button>
      <button id="closeDrawer" class="btn small" type="button">Close</button>
    </div>
  </div>
  <div id="drawerList" class="drawer-list"></div>
  <div class="drawer-f">
    <button id="dedupeBtn" class="btn small" type="button">Dedupe</button>
    <button id="exportBtn" class="btn small" type="button">Export</button>
    <button id="importBtn" class="btn small" type="button">Import</button>
    <input id="importFile" type="file" accept=".json,application/json" hidden>
  </div>
</section>

<div id="toast" class="toast" hidden>
  <span id="toastText"></span>
  <button id="undo" class="btn small" type="button">Undo</button>
</div>

<script>
(function(){
  'use strict';

  var DATA = /*__TABFERRY_DATA__*/[];
  var PRELOADED = /*__TABFERRY_PRELOADED__*/[];
  var DATA_ID = '__TABFERRY_ID__';
  var TOTAL = DATA.length;
  var DUPES = __TABFERRY_DUPES__;
  var REVISION = __TABFERRY_REVISION__;

  var LANG = (function(){
    var requested = '';
    try { requested = new URLSearchParams(location.search).get('lang') || ''; }
    catch (e) { /* older browsers */ }
    var value = (requested || navigator.language || 'en').toLowerCase();
    return value.indexOf('zh') === 0 ? 'zh' : 'en';
  })();

  var I18N = {
    en: {
      search: 'Search title or URL…',
      removed: 'Removed',
      counter: 'of {n}',
      saveOffline: 'Save offline copy',
      connecting: 'Connecting…',
      connected: 'Connected · changes save automatically',
      offline: 'Offline · changes stay on this device',
      offlineNoStore: 'Offline · this browser cannot store changes',
      offlineCopy: 'Offline copy · changes stay on this device',
      offlineCopyNoStore: 'Offline copy · this browser cannot store changes',
      undo: 'Undo',
      restoreAll: 'Restore all',
      close: 'Close',
      export: 'Export',
      import: 'Import',
      dedupe: 'Dedupe',
      restore: 'Restore',
      removeAria: 'Remove from list',
      nothingRemoved: 'Nothing removed yet',
      noMatches: 'No matches',
      allTriaged: 'Everything is triaged. Removed tabs can be restored from the drawer.',
      dupes: '{n} duplicates merged',
      removedOne: 'Removed 1 tab',
      restored: 'Restored',
      allRestored: 'All restored',
      exported: 'Exported {n} items',
      imported: 'Imported {n} items',
      badImport: 'That file is not a TabFerry export',
      newTabs: '{n} new tabs added',
      noDuplicates: 'No duplicates found',
      deduped: 'Merged {n} duplicates',
      confirmDedupe: 'Merge {n} duplicate tabs?',
      confirmRestore: 'Restore all {n} removed tabs?'
    },
    zh: {
      search: '搜索标题或网址…',
      removed: '已移除',
      counter: '共 {n} 个',
      saveOffline: '保存离线副本',
      connecting: '正在连接…',
      connected: '已连接 · 改动会自动保存',
      offline: '离线 · 改动只保存在这台设备',
      offlineNoStore: '离线 · 此浏览器无法保存改动',
      offlineCopy: '离线副本 · 改动只保存在这台设备',
      offlineCopyNoStore: '离线副本 · 此浏览器无法保存改动',
      undo: '撤销',
      restoreAll: '全部恢复',
      close: '关闭',
      export: '导出',
      import: '导入',
      dedupe: '去重',
      restore: '恢复',
      removeAria: '从列表移除',
      nothingRemoved: '还没有移除任何标签页',
      noMatches: '没有匹配的链接',
      allTriaged: '全部处理完了，可在「已移除」里恢复',
      dupes: '合并了 {n} 个重复',
      removedOne: '已移除 1 个标签页',
      restored: '已恢复',
      allRestored: '已全部恢复',
      exported: '已导出 {n} 条',
      imported: '已导入 {n} 条',
      badImport: '这个文件不是 TabFerry 导出的',
      newTabs: '新增 {n} 个标签页',
      noDuplicates: '没有发现重复',
      deduped: '已合并 {n} 个重复',
      confirmDedupe: '合并 {n} 个重复标签页？',
      confirmRestore: '恢复全部 {n} 个已移除的标签页？'
    }
  };

  function t(key, vars){
    var table = I18N[LANG] || I18N.en;
    var text = table[key] != null ? table[key] : I18N.en[key];
    if (text == null) return key;
    if (vars){
      Object.keys(vars).forEach(function(name){
        text = text.replace('{' + name + '}', String(vars[name]));
      });
    }
    return text;
  }

  var $ = function(selector){ return document.querySelector(selector); };
  var listEl = $('#list');
  var qEl = $('#q');
  var remainEl = $('#remain');
  var removedCountEl = $('#removedCount');
  var removedLabelEl = $('#removedLabel');
  var drawerEl = $('#drawer');
  var maskEl = $('#mask');
  var drawerListEl = $('#drawerList');
  var drawerCountEl = $('#drawerCount');
  var drawerLabelEl = $('#drawerLabel');
  var counterSuffixEl = $('#counterSuffix');
  var toastEl = $('#toast');
  var toastTextEl = $('#toastText');
  var undoEl = $('#undo');
  var syncEl = $('#sync');
  var syncTextEl = $('#syncText');
  var emptyEl = $('#empty');
  var downloadLink = $('#downloadLink');
  var dedupeNoteEl = $('#dedupeNote');

  var byUrl = new Map();
  var liByUrl = new Map();
  var removed = new Set();
  var offline = false;
  var lastAction = null;
  var toastTimer = null;
  var query = '';
  var LS_KEY = 'tabferry:' + DATA_ID + ':removed';
  var TRACKING = {
    fbclid: 1, gclid: 1, yclid: 1, mc_cid: 1, mc_eid: 1, igshid: 1,
    mkt_tok: 1, _ga: 1, _gl: 1, ref: 1, ref_src: 1, ref_url: 1,
    spm: 1, scm: 1, share_source: 1, share_medium: 1, share_plat: 1,
    share_tag: 1, share_session_id: 1, from_source: 1, from_spmid: 1,
    vd_source: 1
  };

  function lsLoad(){
    try {
      var raw = localStorage.getItem(LS_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) { return new Set(); }
  }

  function lsSave(){
    try { localStorage.setItem(LS_KEY, JSON.stringify(Array.from(removed))); }
    catch (e) { /* storage may be unavailable for local files */ }
  }

  function storageOK(){
    try {
      localStorage.setItem('__tabferry_probe', '1');
      localStorage.removeItem('__tabferry_probe');
      return true;
    } catch (e) { return false; }
  }

  function setSync(text, cls){
    syncTextEl.textContent = text;
    syncEl.className = 'sync' + (cls ? ' ' + cls : '');
  }

  function applyLanguage(){
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
    qEl.placeholder = t('search');
    removedLabelEl.textContent = t('removed');
    drawerLabelEl.textContent = t('removed');
    $('#restoreAll').textContent = t('restoreAll');
    $('#closeDrawer').textContent = t('close');
    $('#exportBtn').textContent = t('export');
    $('#importBtn').textContent = t('import');
    $('#dedupeBtn').textContent = t('dedupe');
    undoEl.textContent = t('undo');
    downloadLink.textContent = t('saveOffline');
    counterSuffixEl.textContent = t('counter', {n: TOTAL});
    dedupeNoteEl.textContent = DUPES > 0 ? ' · ' + t('dupes', {n: DUPES}) : '';
    syncTextEl.textContent = t('connecting');
    drawerEl.setAttribute('aria-label', t('removed'));
  }

  function makeRow(item){
      byUrl.set(item.u, item);

      var li = document.createElement('li');
      li.className = 'item';

      var link = document.createElement('a');
      link.className = 'link';
      link.href = item.u;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';

      var domain = document.createElement('span');
      domain.className = 'dom';
      domain.textContent = item.d || '';

      var title = document.createElement('span');
      title.className = 'ttl';
      title.textContent = item.t || item.u;

      var url = document.createElement('span');
      url.className = 'url';
      url.textContent = item.u;

      link.appendChild(domain);
      link.appendChild(title);
      link.appendChild(url);

      var remove = document.createElement('button');
      remove.className = 'rm';
      remove.type = 'button';
      remove.setAttribute('aria-label', t('removeAria'));
      remove.textContent = '\u00d7';
      remove.addEventListener('click', (function(u){
        return function(event){
          event.preventDefault();
          event.stopPropagation();
          removeUrl(u);
        };
      })(item.u));

      li.appendChild(link);
      li.appendChild(remove);
      li._s = ((item.t || '') + ' ' + item.u + ' ' + (item.d || '')).toLowerCase();
      li._u = item.u;

      return li;
  }

  function build(){
    var fragment = document.createDocumentFragment();
    for (var i = 0; i < DATA.length; i++){
      var item = DATA[i];
      var li = makeRow(item);
      liByUrl.set(item.u, li);
      fragment.appendChild(li);
    }
    listEl.appendChild(fragment);
  }

  function appendTabs(items){
    var fragment = document.createDocumentFragment();
    var added = 0;
    for (var i = 0; i < items.length; i++){
      var item = items[i];
      if (!item || !item.u || byUrl.has(item.u)) continue;
      var li = makeRow(item);
      liByUrl.set(item.u, li);
      DATA.push(item);
      TOTAL++;
      fragment.appendChild(li);
      added++;
    }
    if (added){
      listEl.appendChild(fragment);
      updateCounts();
      counterSuffixEl.textContent = t('counter', {n: TOTAL});
      syncVisibility();
    }
    return added;
  }

  function syncVisibility(){
    var value = query.trim().toLowerCase();
    var shown = 0;
    liByUrl.forEach(function(li, url){
      var hide = removed.has(url) || (value !== '' && li._s.indexOf(value) === -1);
      li.hidden = hide;
      if (!hide) shown++;
    });
    remainEl.textContent = String(Math.max(0, TOTAL - removed.size));
    if (shown === 0){
      if (TOTAL - removed.size === 0){
        emptyEl.textContent = t('allTriaged');
        emptyEl.hidden = false;
      } else if (value !== ''){
        emptyEl.textContent = t('noMatches');
        emptyEl.hidden = false;
      } else {
        emptyEl.hidden = true;
      }
    } else {
      emptyEl.hidden = true;
    }
  }

  function updateCounts(){
    remainEl.textContent = String(Math.max(0, TOTAL - removed.size));
    removedCountEl.textContent = String(removed.size);
    drawerCountEl.textContent = String(removed.size);
  }

  function push(op, url){
    lsSave();
    if (offline) return;
    fetch('api/' + op, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(url ? {url: url} : {})
    }).then(function(response){
      if (!response.ok) throw new Error('http ' + response.status);
    }).catch(function(){
      offline = true;
      setSync(t('offline'), 'warn');
    });
  }

  function toast(message, canUndo){
    toastTextEl.textContent = message;
    undoEl.hidden = !canUndo;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.hidden = true; }, 4200);
  }

  function removeUrl(url){
    if (removed.has(url)) return;
    removed.add(url);
    lastAction = {op: 'remove', url: url};
    var li = liByUrl.get(url);
    if (li){
      li.classList.add('out');
      setTimeout(function(){
        li.hidden = true;
        li.classList.remove('out');
      }, 170);
    }
    updateCounts();
    renderDrawer();
    push('remove', url);
    toast(t('removedOne'), true);
  }

  function restoreUrl(url){
    if (!removed.has(url)) return;
    removed.delete(url);
    lastAction = {op: 'restore', url: url};
    updateCounts();
    renderDrawer();
    push('restore', url);
    syncVisibility();
    toast(t('restored'), false);
  }

  function renderDrawer(){
    drawerListEl.textContent = '';
    var items = Array.from(removed);
    for (var i = items.length - 1; i >= 0; i--){
      (function(url){
        var item = byUrl.get(url);
        var row = document.createElement('div');
        row.className = 'ditem';

        var meta = document.createElement('div');
        meta.className = 'meta';
        var title = document.createElement('div');
        title.className = 't';
        title.textContent = item ? (item.t || url) : url;
        var host = document.createElement('div');
        host.className = 'u';
        host.textContent = item ? (item.d || url) : url;
        meta.appendChild(title);
        meta.appendChild(host);

        var button = document.createElement('button');
        button.className = 'btn small';
        button.type = 'button';
        button.textContent = t('restore');
        button.addEventListener('click', function(){ restoreUrl(url); });

        row.appendChild(meta);
        row.appendChild(button);
        drawerListEl.appendChild(row);
      })(items[i]);
    }
    if (!items.length){
      var empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = t('nothingRemoved');
      drawerListEl.appendChild(empty);
    }
    drawerCountEl.textContent = String(items.length);
  }

  function openDrawer(){
    renderDrawer();
    drawerEl.hidden = false;
    maskEl.hidden = false;
  }

  function closeDrawer(){
    drawerEl.hidden = true;
    maskEl.hidden = true;
  }

  function exportState(){
    var payload = JSON.stringify({
      app: 'tabferry',
      version: 1,
      data_id: DATA_ID,
      exported: new Date().toISOString(),
      removed: Array.from(removed)
    }, null, 2);
    try {
      var blob = new Blob([payload], {type: 'application/json'});
      var href = URL.createObjectURL(blob);
      var anchor = document.createElement('a');
      anchor.href = href;
      anchor.download = 'tabferry-removed-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(function(){ URL.revokeObjectURL(href); }, 2000);
    } catch (e) { /* downloads may be blocked in local viewers */ }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(payload).catch(function(){});
    }
    toast(t('exported', {n: removed.size}), false);
  }

  function importState(file){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var data = JSON.parse(String(reader.result));
        var values = Array.isArray(data) ? data : ((data && data.removed) || []);
        var added = 0;
        for (var i = 0; i < values.length; i++){
          if (typeof values[i] === 'string' && !removed.has(values[i])){
            removed.add(values[i]);
            added++;
          }
        }
        lsSave();
        updateCounts();
        renderDrawer();
        syncVisibility();
        toast(t('imported', {n: added}), false);
      } catch (e) {
        toast(t('badImport'), false);
      }
    };
    reader.readAsText(file);
  }

  function normalizedKey(raw){
    try {
      var parsed = new URL(raw);
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:'){
        return raw.split('#')[0];
      }
      var host = parsed.hostname.toLowerCase();
      if (host.indexOf('www.') === 0) host = host.slice(4);
      var port = parsed.port;
      if ((parsed.protocol === 'http:' && port === '80') ||
          (parsed.protocol === 'https:' && port === '443')){
        port = '';
      }
      var path = parsed.pathname || '/';
      if (path.length > 1 && path.charAt(path.length - 1) === '/'){
        path = path.replace(/\/+$/, '');
      }
      var pairs = [];
      parsed.searchParams.forEach(function(value, key){
        var lowered = key.toLowerCase();
        if (lowered.indexOf('utm_') === 0 || TRACKING[lowered]) return;
        pairs.push([key, value]);
      });
      pairs.sort(function(a, b){
        return a[0] < b[0] ? -1 : (a[0] > b[0] ? 1 : 0);
      });
      var query = pairs.map(function(pair){
        return encodeURIComponent(pair[0]) + '=' + encodeURIComponent(pair[1]);
      }).join('&');
      return parsed.protocol + '//' + host + (port ? ':' + port : '') + path +
             (query ? '?' + query : '');
    } catch (e) {
      return raw.split('#')[0];
    }
  }

  function dedupeList(){
    var seen = {};
    var extras = [];
    for (var i = 0; i < DATA.length; i++){
      var url = DATA[i].u;
      if (removed.has(url)) continue;
      var key = normalizedKey(url);
      if (seen[key]) extras.push(url);
      else seen[key] = true;
    }
    if (!extras.length){
      toast(t('noDuplicates'), false);
      return;
    }
    if (!confirm(t('confirmDedupe', {n: extras.length}))) return;
    for (var j = 0; j < extras.length; j++){
      removed.add(extras[j]);
      push('remove', extras[j]);
    }
    updateCounts();
    renderDrawer();
    syncVisibility();
    toast(t('deduped', {n: extras.length}), false);
  }

  qEl.addEventListener('input', function(){ query = qEl.value; syncVisibility(); });
  $('#openRemoved').addEventListener('click', openDrawer);
  $('#closeDrawer').addEventListener('click', closeDrawer);
  maskEl.addEventListener('click', closeDrawer);
  undoEl.addEventListener('click', function(){
    if (lastAction && lastAction.op === 'remove') restoreUrl(lastAction.url);
    toastEl.hidden = true;
  });
  $('#restoreAll').addEventListener('click', function(){
    if (!removed.size) return;
    if (!confirm(t('confirmRestore', {n: removed.size}))) return;
    removed.clear();
    push('restore_all', '');
    updateCounts();
    renderDrawer();
    syncVisibility();
    closeDrawer();
    toast(t('allRestored'), false);
  });
  $('#exportBtn').addEventListener('click', exportState);
  $('#dedupeBtn').addEventListener('click', dedupeList);
  $('#importBtn').addEventListener('click', function(){ $('#importFile').click(); });
  $('#importFile').addEventListener('change', function(){
    var file = this.files && this.files[0];
    if (file) importState(file);
    this.value = '';
  });

  function goOffline(isFileCopy){
    offline = true;
    removed = new Set(PRELOADED.concat(Array.from(lsLoad())));
    var key;
    if (storageOK()){
      key = isFileCopy ? 'offlineCopy' : 'offline';
    } else {
      key = isFileCopy ? 'offlineCopyNoStore' : 'offlineNoStore';
    }
    setSync(t(key), 'warn');
    if (downloadLink) downloadLink.hidden = true;
  }

  async function init(){
    applyLanguage();
    build();
    if (location.protocol === 'file:'){
      goOffline(true);
    } else {
      try {
        var response = await fetch('api/state', {cache: 'no-store'});
        if (!response.ok) throw new Error('http ' + response.status);
        var payload = await response.json();
        var server = new Set(Array.isArray(payload.removed) ? payload.removed : []);
        removed = server;
        Array.from(lsLoad()).forEach(function(url){
          if (!removed.has(url)){
            removed.add(url);
            push('remove', url);
          }
        });
        lsSave();
        setSync(t('connected'), 'ok');
      } catch (e) {
        goOffline(false);
      }
    }
    updateCounts();
    syncVisibility();
    renderDrawer();
  }

  async function pollUpdates(){
    if (offline || document.hidden) return;
    try {
      var response = await fetch('api/updates?since=' + REVISION, {cache: 'no-store'});
      if (!response.ok) return;
      var payload = await response.json();
      if (typeof payload.revision !== 'number') return;
      if (payload.revision < REVISION){ location.reload(); return; }
      var added = appendTabs(Array.isArray(payload.tabs) ? payload.tabs : []);
      REVISION = payload.revision;
      if (added) toast(t('newTabs', {n: added}), false);
    } catch (e) { /* transient network error */ }
  }

  init();
  setInterval(pollUpdates, 8000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden) pollUpdates();
  });
})();
</script>
</body>
</html>
