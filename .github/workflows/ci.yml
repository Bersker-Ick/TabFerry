name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no tab data is committed
        run: |
          if git ls-files | grep -E '(^|/)(tabs\.json|state\.json)$|^data/'; then
            echo "::error::Tab data must never be committed"
            exit 1
          fi
          echo "No tab data tracked."

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Test
        run: python -m unittest discover -s tests -v
